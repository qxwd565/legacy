name: Audit Legacy effect text across 2021-2026 clients
on:
  push:
    paths:
      - 'tools/scan-legacy-effects.py'
      - '.github/workflows/audit-legacy-effects.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare archived 2021 and 2026 Hearthstone text
        run: python3 tools/scan-legacy-effects.py
      - name: Preserve audit output
        uses: actions/upload-artifact@v4
        with:
          name: legacy-effect-diff-review
          path: tools/legacy-effect-diff-review.json
          if-no-files-found: error
      - name: Publish audit JSON (do not change card data)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/legacy-effect-diff-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit post-2021 Legacy card text changes [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
