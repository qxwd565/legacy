name: Audit Legacy transient card effects
on:
  push:
    paths:
      - 'tools/scan-legacy-transient-effects.py'
      - '.github/workflows/audit-legacy-transient-effects.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compare all archived client ability texts
        run: python3 tools/scan-legacy-transient-effects.py
      - name: Preserve analysis as artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-effect-build-review
          path: tools/legacy-effect-build-review.json
          if-no-files-found: error
      - name: Publish review-only JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/legacy-effect-build-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit Legacy client effect transitions without mutating cards [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
