name: Publish HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'tools/build-api.py'
      - 'release-policy.json'
      - 'taxonomy-history.json'
      - 'cards.json'
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current and historical API indexes
        run: python3 tools/build-api.py
      - name: Commit changed API indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cards.json render.json history.json data
          if ! git diff --cached --quiet; then
            git commit -m "Publish card API indexes [skip ci]"
            git push
          fi
