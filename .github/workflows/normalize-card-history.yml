name: Publish HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'tools/build-api.py'
      - 'tools/migrate-chronology.py'
      - 'tools/normalize-release-chronology.py'
      - 'tools/normalize-verified-patch-dates.py'
      - 'tools/import-archived-stats.py'
      - 'tools/archived-build-dates.json'
      - 'tools/legacy-balance-candidates.json'
      - 'tools/test-chronology.py'
      - 'tools/normalize-card-linebreaks.py'
      - 'tools/verified-legacy-balances.json'
      - 'tools/apply-verified-balances.py'
      - 'release-policy.json'
      - 'taxonomy-history.json'
      - 'cards.json'
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert legacy cards to release baselines and dated changes
        run: python3 tools/migrate-chronology.py
      - name: Correct independently verified Korean patch dates
        run: python3 tools/normalize-verified-patch-dates.py
      - name: Normalize corrected first playable dates
        run: python3 tools/normalize-release-chronology.py
      - name: Apply independently verified Legacy balance history
        run: python3 tools/apply-verified-balances.py
      - name: Import verified archived Legacy numeric changes
        run: python3 tools/import-archived-stats.py
      - name: Normalize display line breaks without changing raw evidence
        run: python3 tools/normalize-card-linebreaks.py
      - name: Generate current and historical API indexes
        run: python3 tools/build-api.py
      - name: Verify baseline, patches, current cache, and historical lookups
        run: python3 tools/test-chronology.py
      - name: Commit changed API indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cards.json render.json history.json data tools/legacy-stat-reconstruction-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish card API indexes [skip ci]"
            git push
          fi
