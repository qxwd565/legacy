name: Publish HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'tools/build-api.py'
      - 'tools/import-basic-death-knight.py'
      - 'tools/build_date_api.py'
      - 'tools/legacy_projection.py'
      - 'tools/test-legacy-compatibility.py'
      - 'tools/date_schema.py'
      - 'tools/migrate-date-schema.py'
      - 'tools/test-date-schema.py'
      - 'metadata/**'
      - 'tools/migrate-chronology.py'
      - 'tools/normalize-release-chronology.py'
      - 'tools/normalize-verified-patch-dates.py'
      - 'tools/import-archived-stats.py'
      - 'tools/archived-build-dates.json'
      - 'tools/legacy-balance-candidates.json'
      - 'tools/test-chronology.py'
      - 'tools/normalize-card-linebreaks.py'
      - 'tools/verified-legacy-balances.json'
      - 'tools/apply-verified-balances.py'
      - 'release-policy.json'
      - 'taxonomy-history.json'
      - 'cards.json'
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preservation tests read the pinned pre-migration source commit.
          fetch-depth: 0
      - name: Import BASIC Death Knight card art and catalogue
        run: python3 tools/import-basic-death-knight.py
      - name: Migrate old wrappers only once, preserving evidence
        run: python3 tools/migrate-date-schema.py
      - name: Normalize display line breaks without changing raw evidence
        run: python3 tools/normalize-card-linebreaks.py
      - name: Generate current and historical API indexes
        run: python3 tools/build-api.py
      - name: Verify baseline, patches, current cache, and historical lookups
        run: python3 tools/test-chronology.py
      - name: Verify date-map state, preservation, and API boundaries
        run: python3 tools/test-date-schema.py
      - name: Verify unchanged-plugin compatibility projection
        run: python3 tools/test-legacy-compatibility.py
      - name: Commit changed API indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- art/ golden/ cards.json render.json history.json cards-date.json render-date.json history-date.json data metadata tools/legacy-compatibility-losses.json tools/date-schema-validation.json tools/legacy-compatibility-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish card API indexes [skip ci]"
            git push
          fi
