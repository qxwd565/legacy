name: 사이트 확장팩 목록 자동 갱신

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsdeck-site-expansions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 확장팩 메타데이터 수집
        run: python tools/update-site-expansions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 목록 반영
        run: |
          if git diff --quiet -- site-expansions.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-expansions.json
          git commit -m "사이트 확장팩 출시일 목록 동기화 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
